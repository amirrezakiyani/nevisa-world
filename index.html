<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحه با پس‌زمینه ثابت</title>

    <style>
        /* تنظیمات پایه صفحه */
        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            /* تنظیم تصویر پس‌زمینه */
            background-image: url("bg.jpg");
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            /* ظاهر متن */
            font-family: Tahoma, Arial, sans-serif;
            color: white;
        }

        /* محتوای نمونه صفحه */
        .content {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 24px;
            box-sizing: border-box;

            /* لایه تیره برای خوانایی بهتر متن */
            background: rgba(0, 0, 0, 0.25);
        }

        h1 {
            font-size: clamp(28px, 5vw, 48px);
            margin-bottom: 12px;
        }

        p {
            font-size: 18px;
            line-height: 1.8;
        }
    </style>
</head>

<body>
    <main class="content">
        <h1>به سایت من خوش آمدید</h1>
        <p>این متن روی تصویر پس‌زمینه نمایش داده می‌شود.</p>
    </main>
</body>
</html>
